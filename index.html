<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOYEN HILLS — ART WILL TEE, made in Latvia</title>
  <meta name="description" content="MOYEN HILLS. ART WILL TEE: boxy cut-off t-shirt, 100% cotton, screen printed front, back and neck label. Made in Latvia.">
  <meta property="og:title" content="MOYEN HILLS — ART WILL TEE">
  <meta property="og:image" content="images/landing.jpg">
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="bar">
    <button class="bar__logo" type="button" data-top aria-label="MOYEN HILLS, back to top">
      <img src="images/logo.png" width="2400" height="262" alt="MOYEN HILLS">
    </button>
    <button class="bar__cart" type="button" data-open-cart aria-haspopup="dialog">cart <span data-cart-count>0</span></button>
  </header>

  <main id="top">
    <section class="landing" aria-label="ART WILL TEE">
      <h1 class="sr">MOYEN HILLS — ART WILL TEE</h1>
      <img src="images/landing.jpg" width="1600" height="1280" alt="Two people from behind at night wearing the ART WILL TEE, ART WILL SAVE US ALL printed on the back" fetchpriority="high">
    </section>
  </main>

  <!-- Cart (shared) -->
  <dialog class="cart" data-cart aria-labelledby="cart-title">
    <div class="cart__head">
      <h2 class="cart__title" id="cart-title">Cart</h2>
      <button type="button" class="link-u" data-close-cart>Close</button>
    </div>
    <div data-cart-view>
      <ul class="cart__items" data-cart-items></ul>
      <p class="cart__empty" data-cart-empty>Your cart is empty.</p>
      <div class="cart__total" data-cart-total-row hidden><span>Subtotal</span><span data-cart-total>€0</span></div>
      <p class="cart__hint" data-cart-total-row hidden>Delivery is added when we confirm your order by email.</p>
      <form class="checkout" data-checkout hidden>
        <h3 class="checkout__title">Your details</h3>
        <label>Full name<input name="name" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
        <label>Address<input name="address" autocomplete="street-address" required></label>
        <div class="checkout__two">
          <label>City<input name="city" autocomplete="address-level2" required></label>
          <label>Postcode<input name="postcode" autocomplete="postal-code" required></label>
        </div>
        <label>Country<input name="country" autocomplete="country-name" value="Latvia" required></label>
        <label>Note (optional)<textarea name="note" rows="2"></textarea></label>
        <input type="text" name="_honey" class="sr" tabindex="-1" autocomplete="off">
        <button class="btn btn--wide" type="submit">Place order</button>
        <p class="checkout__msg" data-checkout-msg role="status" aria-live="polite"></p>
      </form>
    </div>
    <div class="cart__done" data-cart-done hidden>
      <p class="cart__done-title">Order received</p>
      <p>Thank you. We will email you within a day to confirm your order and send the payment details.</p>
      <button type="button" class="btn" data-close-cart>Keep looking</button>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
